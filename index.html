<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<title>VaultChatt II — Access Terminal</title>

<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#e2b24c" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="msapplication-config" content="browserconfig.xml" />
<meta name="theme-color" content="#170f08" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="ancient.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <div class="hex-field" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <section class="auth-hud" aria-label="Clock and welcome">
    <p class="hud-greeting"><i class="hud-pulse"></i> <span data-hud="greeting">WELCOME</span> · SECURE LINK ONLINE</p>
    <h2 class="hud-welcome" data-hud-welcome>WELCOME, OPERATOR</h2>
    <div class="hud-time hud-time-lg" data-hud="time" title="Tap to switch 12/24h">--:--:--</div>
    <p class="hud-date-line"><span data-hud="weekday">—</span> · <span data-hud="date">—</span> · <span data-hud="tz">—</span></p>
  </section>

  <main class="auth-card">
    <div class="brand">
      <span class="brand-glyph">𒀭</span>
      <h1>VAULT<span class="accent">CHATT</span> II</h1>
      <p class="brand-sub">Sealed-tablet relay · c. 3000 BCE</p>
    </div>

    <form id="auth-form" class="auth-form" autocomplete="on">
      <h2 id="form-title">Sign in</h2>

      <div class="field hidden" id="field-username">
        <label for="input-username">Username</label>
        <input id="input-username" type="text" minlength="3" maxlength="30" placeholder="e.g. veus_alpha" autocomplete="off" autocapitalize="none" spellcheck="false" />
      </div>

      <div class="field hidden" id="field-display-name">
        <label for="input-display-name">Display name</label>
        <input id="input-display-name" type="text" placeholder="How contacts see you" autocomplete="off" />
      </div>

      <div class="field">
        <label for="input-email">Email</label>
        <input id="input-email" type="email" required autocomplete="username" data-autofill="allow" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="input-password">Password</label>
        <input id="input-password" type="password" required autocomplete="current-password" data-autofill="allow" placeholder="••••••••" />
      </div>

      <p id="form-error" class="form-error hidden"></p>

      <button id="btn-submit" type="submit" class="btn-primary">Sign in</button>
      <button id="toggle-mode" type="button" class="btn-link">Don't have an account? Sign up</button>
    </form>

    <div class="auth-divider">or</div>
    <button id="btn-google" type="button" class="btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.8-9.9 6.8-17.4z"/>
        <path fill="#FBBC05" d="M10.5 19.3l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.8l7.9-6.1c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7z"/>
        <path fill="#34A853" d="M24 48c6.4 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2.1 1.4-4.9 2.3-8.6 2.3-6.3 0-11.6-3.6-13.5-8.7l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <p class="fine-print">
      Same Firestore project as the Android app — your ID code, contacts, and messages sync live across both.
    </p>
  </main>
  <script type="module" src="noautofill.js"></script>
  <script type="module" src="viewport.js"></script>
  <script type="module" src="hud.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
